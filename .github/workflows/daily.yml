name: Stock Radar completed-daily rebuild

on:
  schedule:
    # One conservative weekday run after US markets are closed in both DST seasons.
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-radar-data
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Official actions/checkout v4 tag resolved and verified on 2026-08-12.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      # Official actions/setup-python v5 tag resolved and verified on 2026-08-12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore full snapshot
        run: gzip -dk data/output/latest.json.gz

      - name: Install pinned direct dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run deterministic reliability tests
        run: python -m unittest discover -s tests -v

      - name: Build completed-daily snapshot
        run: python -m src.analyze
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check published data health
        continue-on-error: true
        run: python -m src.published_health

      # GitHub has no durable private ledger. This only injects the already
      # committed count/progress aggregate; it never captures or labels shadows.
      - name: Republish forward-validation aggregate only
        run: python -m src.probability_forward publish-status --aggregate-only

      - name: Build login-free static dashboard data
        run: python -m src.export_static

      - name: Compress full snapshot
        run: gzip -n -c -9 data/output/latest.json > data/output/latest.json.gz

      - name: Publish complete data transaction
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stock-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Stage every already-versioned runtime artifact. New untracked files
          # still require an explicit allow-list entry and fail visibly below.
          git add -u -- data docs
          git add \
            data/output/latest.json.gz \
            data/failed_symbols.json \
            data/fundamentals.json \
            data/deep_fundamentals.json \
            data/portfolio.json \
            data/earnings.json \
            data/fx_usd.json \
            data/macro.json \
            data/news_cache.json \
            data/probability_models.json \
            data/probability_validation.json \
            data/probability_forward_status.json \
            docs/data.json \
            docs/details
          for optional in \
            data/sec_ticker_map.json \
            data/sec_companyfacts.json \
            data/sec_insider_signals.json \
            data/recommendation_log.jsonl \
            data/recommendation_outcomes.jsonl \
            data/valuation_history.json \
            data/financial_sector_history.json \
            data/opportunity_history.json \
            data/options_gex.json \
            data/fred_regime.json \
            data/finra_short_interest.json \
            data/sec_13f_changes.json \
            data/congress_trades.json \
            data/market_positioning.json \
            data/wikipedia_attention.json \
            data/job_postings.json \
            data/filing_diffs.json \
            data/earnings_tone.json \
            data/earnings_text_sources.json \
            data/valuation_anomalies.json
          do
            if [ -e "$optional" ]; then git add "$optional"; fi
          done
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Completed daily snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          remaining="$(git status --porcelain)"
          if [ -n "$remaining" ]; then
            echo "::error title=Uncommitted runtime artifacts::Files remained after the snapshot commit."
            printf '%s\n' "$remaining"
            exit 1
          fi
          published=false
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              published=true
              break
            fi
            if git rev-parse --verify REBASE_HEAD >/dev/null 2>&1; then
              git rebase --abort
            fi
            echo "::warning title=Snapshot publication retry::Attempt ${attempt} of 3 failed."
            sleep $((attempt * 5))
          done
          if [ "$published" != "true" ]; then
            echo "::error title=Daily snapshot push failed::All three pull/rebase/push attempts failed."
            git status --short
            exit 1
          fi

      - name: Report publication failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error title=Stock Radar publication failed::The analysis may have completed, but main was not updated."
          printf '%s\n' \
            "## Stock Radar publication failed" \
            "" \
            "The data build completed, but the snapshot transaction did not reach main." \
            "Inspect the Publish complete data transaction step for named remaining files or push errors." \
            >> "$GITHUB_STEP_SUMMARY"
