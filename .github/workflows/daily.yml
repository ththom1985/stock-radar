name: Stock Radar completed-daily rebuild

on:
  schedule:
    # One conservative weekday run after US markets are closed in both DST seasons.
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-radar-data
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Official actions/checkout v4 tag resolved and verified on 2026-08-12.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      # Official actions/setup-python v5 tag resolved and verified on 2026-08-12.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned direct dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run deterministic reliability tests
        run: python -m unittest discover -s tests -v

      - name: Build completed-daily snapshot
        run: python -m src.analyze

      - name: Publish complete data transaction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stock-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add \
            data/output/latest.json \
            data/failed_symbols.json \
            data/fundamentals.json \
            data/deep_fundamentals.json \
            data/portfolio.json \
            data/earnings.json \
            data/fx_usd.json \
            data/macro.json \
            data/news_cache.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Completed daily snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
